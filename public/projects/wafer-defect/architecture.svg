<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f5f4a"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- 1행 -->
  <g>
    <rect x="40" y="50" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="2"/>
    <text x="64" y="84" font-size="13" font-weight="700" fill="#7a8178">STEP 01</text>
    <text x="64" y="112" font-size="20" font-weight="800" fill="#1f2a24">WM-811K 데이터 준비</text>
    <text x="64" y="146" font-size="14" fill="#2d352f">라벨 데이터 172,950장 · 9개 클래스</text>
    <text x="64" y="170" font-size="14" fill="#2d352f">64×64 변환 · 3채널 · ImageNet 정규화</text>
    <text x="64" y="194" font-size="14" fill="#2d352f">5개 fold 분할 (fold 0 = 고정 테스트셋)</text>
  </g>

  <g>
    <rect x="435" y="50" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="2"/>
    <text x="459" y="84" font-size="13" font-weight="700" fill="#7a8178">STEP 02</text>
    <text x="459" y="112" font-size="20" font-weight="800" fill="#1f2a24">정상 · 결함 비율 탐색</text>
    <text x="459" y="146" font-size="14" fill="#2d352f">결함 5,103장 고정, None 29,486장에서</text>
    <text x="459" y="170" font-size="14" fill="#2d352f">1,000장씩 줄이며 이진 분류</text>
    <rect x="459" y="186" width="210" height="30" rx="15" fill="#eef3ec" stroke="#a8b89a"/>
    <text x="564" y="206" font-size="14" font-weight="700" fill="#2f4638" text-anchor="middle">기준 비율 ≈ 3.23 : 1</text>
  </g>

  <g>
    <rect x="830" y="50" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="2"/>
    <text x="854" y="84" font-size="13" font-weight="700" fill="#7a8178">STEP 03</text>
    <text x="854" y="112" font-size="20" font-weight="800" fill="#1f2a24">증강 예산 산출</text>
    <text x="854" y="146" font-size="14" fill="#2d352f">29,486 : X = 16,486 : 5,103</text>
    <text x="854" y="170" font-size="14" fill="#2d352f">필요 결함 수 ≈ 9,127장</text>
    <rect x="854" y="186" width="210" height="30" rx="15" fill="#eef3ec" stroke="#a8b89a"/>
    <text x="959" y="206" font-size="14" font-weight="700" fill="#2f4638" text-anchor="middle">증강 예산 4,024장</text>
  </g>

  <!-- 2행 -->
  <g>
    <rect x="830" y="320" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="2"/>
    <text x="854" y="354" font-size="13" font-weight="700" fill="#7a8178">STEP 04</text>
    <text x="854" y="382" font-size="20" font-weight="800" fill="#1f2a24">클래스별 증강량 배분</text>
    <text x="854" y="416" font-size="14" fill="#2d352f">난이도 D = 1 − F2 (검증셋 기준)</text>
    <text x="854" y="440" font-size="14" fill="#2d352f">희소성 = log(N_max / N_class)</text>
    <text x="854" y="464" font-size="14" fill="#2d352f">가중치 = D × (1 + 0.3 × 희소성)</text>
    <text x="854" y="488" font-size="13" fill="#7a8178">예산을 가중치 비율로 배분</text>
  </g>

  <g>
    <rect x="435" y="320" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="2"/>
    <text x="459" y="354" font-size="13" font-weight="700" fill="#7a8178">STEP 05</text>
    <text x="459" y="382" font-size="20" font-weight="800" fill="#1f2a24">비교 데이터셋 3종</text>
    <text x="459" y="416" font-size="14" fill="#2d352f">원본 (증강 없음)</text>
    <text x="459" y="440" font-size="14" fill="#2d352f">균등 증강 (클래스당 503장)</text>
    <text x="459" y="464" font-size="14" font-weight="700" fill="#3f5f4a">차등 증강 (난이도 · 희소성 기반)</text>
    <text x="459" y="488" font-size="13" fill="#7a8178">같은 증강 기법(회전 · 반전) · 같은 예산</text>
  </g>

  <g>
    <rect x="40" y="320" width="330" height="190" rx="14" fill="#ffffff" stroke="#3f5f4a" stroke-width="3"/>
    <text x="64" y="354" font-size="13" font-weight="700" fill="#7a8178">STEP 06</text>
    <text x="64" y="382" font-size="20" font-weight="800" fill="#1f2a24">동일 조건 학습 · 평가</text>
    <text x="64" y="416" font-size="14" fill="#2d352f">MobileNetV2 (ImageNet 사전학습)</text>
    <text x="64" y="440" font-size="14" fill="#2d352f">검증 Macro-F2 기준 모델 선정</text>
    <text x="64" y="464" font-size="14" fill="#2d352f">fold 0에서 Macro-F2 ·</text>
    <text x="64" y="488" font-size="14" fill="#2d352f">Defect Macro-F2 · 클래스별 F2 비교</text>
  </g>

  <!-- 흐름 화살표 -->
  <line x1="370" y1="145" x2="429" y2="145" stroke="#3f5f4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="145" x2="824" y2="145" stroke="#3f5f4a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 240 L 995 314" fill="none" stroke="#3f5f4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="415" x2="771" y2="415" stroke="#3f5f4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="435" y1="415" x2="376" y2="415" stroke="#3f5f4a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
